spring:
  application:
    name: campus-proposal
  datasource:
    url: jdbc:postgresql://localhost:5432/campus_proposal
    username: postgres
    # 本机演示环境:真实密码从环境变量 DB_PASSWORD 读取,不把本机密码提交进仓库
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      # 演示项目用 update 自动建表;生产环境应使用迁移脚本(Flyway/Liquibase)管理表结构
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
